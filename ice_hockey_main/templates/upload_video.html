<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>

    <style>
        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Form container styling */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            margin: 20px;
        }

        /* Form group styling */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input[type="file"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Messages */
        .message {
            text-align: center;
            font-size: 16px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }

        .success {
            color: #4CAF50;
            background-color: #E8F5E9;
            border: 1px solid #4CAF50;
        }

        .error {
            color: #F44336;
            background-color: #FDECEA;
            border: 1px solid #F44336;
        }

        /* Back button */
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 30px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Upload Video</h1>

        <!-- Success and Error Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Video Upload -->
            <div class="form-group">
                <label for="video_file">Upload Video:</label>
                <input type="file" name="video_file" id="video_file" required>
            </div>

            <!-- Select Date -->
            <div class="form-group">
                <label for="log_date">Select Date:</label>
                <input type="date" name="log_date" id="log_date" required>
            </div>

            <input type="submit" value="Upload Video">
        </form>
    </div>

    <a href="/trim-video" class="back-button">Back</a>

</body>
</html>
