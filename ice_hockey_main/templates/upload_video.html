<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <style>
        :root {
            --bg: #2c4c78;
            --bg-gradient-end: #323c66;
            --surface: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7a8f;
            --primary: #3b7dd8;
            --primary-dark: #2c5fa8;
            --success-bg: #e8f9ee;
            --success-text: #0e8f42;
            --danger-bg: #fdecec;
            --danger-text: #c0392b;
            --border: #e8edf3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }
        .form-container {
            background-color: var(--surface);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        .form-container h1 { color: var(--text); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-group input[type="file"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 125, 216, 0.15);
        }
        input[type="submit"] {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        input[type="submit"]:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
        }
        .success { color: var(--success-text); background-color: var(--success-bg); }
        .error { color: var(--danger-text); background-color: var(--danger-bg); }
        .back-button {
            position: absolute;
            top: 40px;
            right: 20px;
            padding: 11px 22px;
            background-color: var(--primary);
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        .back-button:hover { background-color: var(--primary-dark); transform: translateY(-1px);}
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Upload Video</h1>

        <!-- Success and Error Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Video Upload -->
            <div class="form-group">
                <label for="video_file">Upload Video:</label>
                <input type="file" name="video_file" id="video_file" required>
            </div>

            <!-- Select Date -->
            <div class="form-group">
                <label for="log_date">Select Date:</label>
                <input type="date" name="log_date" id="log_date" required>
            </div>

            <input type="submit" value="Upload Video">
        </form>
    </div>

    <a href="/trim-video" class="back-button">Back</a>

</body>
</html>
