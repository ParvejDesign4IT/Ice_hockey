<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <style>
        :root {
            --bg: #2c4c78;
            --bg-gradient-end: #323c66;
            --surface: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7a8f;
            --primary: #3b7dd8;
            --primary-dark: #2c5fa8;
            --success-bg: #e8f9ee;
            --success-text: #0e8f42;
            --danger-bg: #fdecec;
            --danger-text: #c0392b;
            --border: #e8edf3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }
        .form-container {
            background-color: var(--surface);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        .form-container h1 { color: var(--text); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-group input[type="file"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 125, 216, 0.15);
        }
        input[type="submit"] {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        input[type="submit"]:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        input[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
        }
        .success { color: var(--success-text); background-color: var(--success-bg); }
        .error { color: var(--danger-text); background-color: var(--danger-bg); }
        .back-button {
            position: absolute;
            top: 40px;
            right: 20px;
            padding: 11px 22px;
            background-color: var(--primary);
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        .back-button:hover { background-color: var(--primary-dark); transform: translateY(-1px);}

        /* Progress bar */
        .progress-wrap { display: none; margin-top: 16px; }
        .progress-track {
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            height: 14px;
        }
        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.2s ease;
        }
        .progress-text {
            text-align: center;
            margin: 8px 0 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .back-button, .uploaded-button {
        position: absolute;
        top: 40px;
        padding: 11px 22px;
        background-color: var(--primary);
        color: white;
        border-radius: 9px;
        text-decoration: none;
        font-size: 20px;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
        transition: all 0.15s ease;
    }
    .back-button:hover, .uploaded-button:hover { background-color: var(--primary-dark); transform: translateY(-1px); }
    .back-button { right: 20px; }
    .uploaded-button { right: 130px; }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Upload Video</h1>

        <!-- Success and Error Messages -->
        <div id="messageBox">
            {% if messages %}
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <form method="post" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}

            <!-- Video Upload -->
            <div class="form-group">
                <label for="video_file">Upload Video:</label>
                <input type="file" name="video_file" id="video_file" required>
            </div>

            <input type="submit" value="Upload Video" id="uploadBtn">

            <!-- Progress bar -->
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">0%</p>
            </div>
        </form>
    </div>
    <a href="/uploaded-videos" class="uploaded-button">Uploaded videos</a>
    <a href="/trim-video" class="back-button">Back</a>

<script>
    const uploadForm   = document.getElementById("uploadForm");
    const uploadBtn    = document.getElementById("uploadBtn");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar  = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const messageBox   = document.getElementById("messageBox");

    function showMessage(text, type) {
        messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    function resetUploadUI() {
        uploadBtn.disabled = false;
        uploadBtn.value = "Upload Video";
        progressWrap.style.display = "none";
        progressBar.style.width = "0";
    }

    uploadForm.addEventListener("submit", function (e) {
        e.preventDefault();

        uploadBtn.disabled = true;
        uploadBtn.value = "Uploading...";
        messageBox.innerHTML = "";
        progressWrap.style.display = "block";
        progressBar.style.width = "0";
        progressText.innerText = "0%";

        const xhr = new XMLHttpRequest();
        xhr.open("POST", window.location.href);

        // Real upload progress, 0 to 100%
        xhr.upload.onprogress = function (ev) {
            if (!ev.lengthComputable) return;
            const pct      = Math.round((ev.loaded / ev.total) * 100);
            const loadedMB = (ev.loaded / 1048576).toFixed(1);
            const totalMB  = (ev.total / 1048576).toFixed(1);
            progressBar.style.width = pct + "%";
            progressText.innerText = pct < 100
                ? `${pct}%  (${loadedMB} / ${totalMB} MB)`
                : "100%  Saving on server, please wait...";
        };

        xhr.onload = function () {
            if (xhr.status >= 400) {
                resetUploadUI();
                showMessage("Upload failed (server error " + xhr.status + "). Please try again.", "error");
                return;
            }

            // Django redirects back to this page; read the success/error message from it
            const doc = new DOMParser().parseFromString(xhr.responseText, "text/html");
            const newMessages = doc.getElementById("messageBox");
            messageBox.innerHTML = newMessages ? newMessages.innerHTML : "";

            // Redirect only if the server reported a successful upload
            const uploadedOk = messageBox.querySelector(".message.success") !== null;

            if (uploadedOk) {
                progressText.innerText = "100%  Upload complete. Redirecting to Trim Video...";
                setTimeout(function () {
                    window.location.href = "{% url 'trim_video' %}";
                }, 1500);
                return;   // keep the button disabled so the video can't be uploaded twice
            }

            // Duplicate name or other error: stay on this page
            resetUploadUI();
            uploadForm.reset();
        };

        xhr.onerror = function () {
            resetUploadUI();
            showMessage("Upload failed. Please check your connection and try again.", "error");
        };

        xhr.send(new FormData(uploadForm));   // FormData includes the CSRF token
    });
</script>

</body>
</html>
