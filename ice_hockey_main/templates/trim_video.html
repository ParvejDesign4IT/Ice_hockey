<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trim Video</title>
    <style>
        :root {
            --bg: #2c4c78;
            --bg-gradient-end: #323c66;
            --surface: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7a8f;
            --primary: #3b7dd8;
            --primary-dark: #2c5fa8;
            --success-bg: #e8f9ee;
            --success-text: #0e8f42;
            --danger-bg: #fdecec;
            --danger-text: #c0392b;
            --border: #e8edf3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: var(--text);
            font-size: 26px;
            font-weight: 700;
        }
        .form-container {
            background-color: var(--surface);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin: 90px 20px 20px 20px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: var(--text);
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        select, input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 125, 216, 0.15);
        }
        input[type="submit"] {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        input[type="submit"]:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Availability message */
        .availability {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
        }
        .available { background-color: var(--success-bg); color: var(--success-text); }
        .not-available { background-color: var(--danger-bg); color: var(--danger-text); }

        .download-button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            margin-top: 15px;
            background-color: var(--success-text);
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-button, .upload-button, .trimmed-button {
            position: absolute;
            padding: 11px 22px;
            background-color: var(--primary);
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(59, 125, 216, 0.35);
            transition: all 0.15s ease;
        }
        .back-button:hover, .upload-button:hover, .trimmed-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        .back-button { top: 40px; right: 20px; }
        .upload-button { top: 40px; right: 120px; }
        .trimmed-button { top: 40px; right: 350px; }

        /* Progress bar */
        .progress-track { background: var(--border); border-radius: 999px; overflow: hidden; height: 14px; margin-top: 16px; }
        .progress-bar { height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width 0.3s ease; }
        .progress-text { margin: 10px 0 0; font-size: 16px; font-weight: 600; color: var(--text-muted); }
    </style>
</head>

<body>

<div class="form-container">
    <h1>Trim Video</h1>

    <!-- Error message display -->
    {% if error_message %}
        <div class="availability not-available" style="display:block;">{{ error_message }}</div>
    {% endif %}

    <!-- Video availability / trim result message (AJAX) -->
    <div id="videoAvailability" class="availability" style="display: none;"></div>

    <form method="post">
        {% csrf_token %}

        <label>Select Device UID:</label>
        <select name="device_uid" required>
            <option value="">-- Select a Device UID --</option>
            {% for device in distinct_device_count %}
                <!-- value still submits the REAL deviceUID; visible text is the friendly label -->
                <option value="{{ device.deviceUID }}" {% if device.deviceUID == selected_device_uid %}selected{% endif %}>
                    {{ device.label }}
                </option>
            {% endfor %}
        </select>

        <label>Select Date:</label>
        <input type="date" name="log_date" id="log_date" required>

        <label>Select Video:</label>
        <select name="video_id" id="video_id" required>
            <option value="">
                {% if videos %}-- Select an uploaded video --{% else %}-- No videos uploaded yet --{% endif %}
            </option>
            {% for video in videos %}
                <option value="{{ video.id }}">
                    {{ video.name }} (uploaded {{ video.uploaded }})
                </option>
            {% endfor %}
        </select>

        <label>Game Start Time (HH:MM:SS):</label>
        <input type="text" name="game_start_time" value="00:00:00" required pattern="^([01]\d|2[0-3]):([0-5]\d):([0-5]\d)$" title="Format: HH:MM:SS">

        <input type="submit" value="Trim Video">
    </form>

    <!-- Download button appears here after trimming finishes -->
    <div id="downloadArea"></div>

    {% if success_message %}
    <div class="availability available" style="display:block;">
         {{ success_message }}
    </div>
    {% endif %}

    {% if download_url %}
        <a href="{{ download_url }}" class="download-button" download>
            ⬇ Download Trimmed Video
        </a>
    {% endif %}

    <a href="/trimmed-videos" class="trimmed-button">Trimmed videos</a>
    <a href="/status-logs" class="back-button">Back</a>
    <a href="/upload-video" class="upload-button">Upload your game</a>
</div>

<!-- Trimming Progress Popup -->
<div id="trimOverlay" style="
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:30px 40px; border-radius:16px; text-align:center;
                box-shadow:0 25px 60px rgba(0,0,0,0.3); width:420px; max-width:calc(100% - 40px);">
        <h3 style="margin:0;">✂ Trimming video...</h3>
        <div class="progress-track"><div class="progress-bar" id="trimBar"></div></div>
        <p class="progress-text" id="trimText">0%</p>
    </div>
</div>


<script>
    const dateInput = document.getElementById("log_date");
    const deviceSelect = document.querySelector("select[name='device_uid']");
    const logMsgBox = document.getElementById("videoAvailability");

    const trimForm = document.querySelector("form");
    const overlay = document.getElementById("trimOverlay");

    const trimBar = document.getElementById("trimBar");
    const trimText = document.getElementById("trimText");
    const downloadArea = document.getElementById("downloadArea");

    // ---------- Status log availability check ----------
    function checkStatusLogs() {
        const selectedDate = dateInput.value;
        const deviceUID = deviceSelect.value;

        if (!selectedDate || !deviceUID) {
            logMsgBox.style.display = "none";
            return;
        }

        fetch(`/check-statuslog/?device_uid=${deviceUID}&date=${selectedDate}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                logMsgBox.style.display = "block";
                if (data.available) {
                    logMsgBox.className = "availability available";
                    logMsgBox.innerText = ` ${data.message}`;
                } else {
                    logMsgBox.className = "availability not-available";
                    logMsgBox.innerText = ` ${data.message}`;
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                logMsgBox.style.display = "block";
                logMsgBox.className = "availability not-available";
                logMsgBox.innerText = " Error checking availability: " + error.message;
            });
    }

    // Trigger on change
    dateInput.addEventListener("change", checkStatusLogs);
    deviceSelect.addEventListener("change", checkStatusLogs);

    // ---------- Trim progress ----------
    function setTrimProgress(pct, msg) {
        trimBar.style.width = pct + "%";
        trimText.innerText = `${Math.floor(pct)}%  ${msg || ""}`;
    }

    function showTrimResult(message, ok) {
        logMsgBox.style.display = "block";
        logMsgBox.className = "availability " + (ok ? "available" : "not-available");
        logMsgBox.innerText = message;
    }

    function pollTrim(jobId) {
        const timer = setInterval(() => {
            fetch(`{% url 'trim_progress' %}?job_id=${jobId}`)
                .then(r => r.json())
                .then(job => {
                    setTrimProgress(job.percent, job.message);

                    if (job.status === "done") {
                        clearInterval(timer);
                        overlay.style.display = "none";
                        showTrimResult(job.message, true);
                        downloadArea.innerHTML =
                            `<a href="${job.download_url}" class="download-button" download>⬇ Download Trimmed Video</a>`;
                    } else if (job.status === "error") {
                        clearInterval(timer);
                        overlay.style.display = "none";
                        showTrimResult(job.message, false);
                    }
                })
                .catch(() => {
                    clearInterval(timer);
                    overlay.style.display = "none";
                    showTrimResult("Lost connection while checking progress.", false);
                });
        }, 1000);
    }

    trimForm.addEventListener("submit", function (e) {
        e.preventDefault();
        downloadArea.innerHTML = "";
        logMsgBox.style.display = "none";
        setTrimProgress(0, "Starting...");
        overlay.style.display = "flex";

        fetch("{% url 'start_trim' %}", { method: "POST", body: new FormData(trimForm) })   // FormData carries the CSRF token
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok || data.error) throw new Error(data.error || "Could not start trimming.");
                pollTrim(data.job_id);
            })
            .catch(err => {
                overlay.style.display = "none";
                showTrimResult(err.message, false);
            });
    });
</script>

</body>
</html>
